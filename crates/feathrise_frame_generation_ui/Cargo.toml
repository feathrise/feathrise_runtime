# SDK 无关的帧生成 UI 捕获、世界标签分离与普通真实帧恢复。
[package]
description = "World UI separation and transparent capture for frame generation"
name = "feathrise_frame_generation_ui"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feathrise/feathrise_runtime"

[dependencies]
bevy = { workspace = true }
feathrise_scene_core = { workspace = true }
feathrise_billboard_text = { workspace = true }
feathrise_settings = { workspace = true }
indexmap = "2.14.0"
wgpu = { workspace = true }

[dev-dependencies]
wesl = "0.6.0" # CPU 测试使用 Bevy 同版编译器验证世界 UI 的两条路径。
