# feathrise_map_content：地图编辑器与运行时共享的数据资产叶子层。
[package]
description = "Project map manifests, scene data and portal asset contracts"
name = "feathrise_map_content"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feathrise/feathrise_runtime"

[dependencies]
bevy = { workspace = true }
serde = { workspace = true, features = ["rc"] } # 子地图引用在IO线程冻结为Arc，主帧共享来源快照。
serde_json = { workspace = true }
sha2 = { workspace = true } # 公共作者事务使用流式内容摘要，不复制完整JSON字节。

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] } # 下沉现有地图原子替换事务。
