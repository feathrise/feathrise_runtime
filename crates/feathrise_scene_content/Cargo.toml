# feathrise_scene_content：场景编辑器与运行时共享的数据资产叶子层。
[package]
description = "Project scene catalogs, manifests and portal asset contracts"
name = "feathrise_scene_content"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feathrise/feathrise_runtime"

[dependencies]
bevy = { workspace = true }
serde = { workspace = true, features = ["rc"] } # 子场景引用在IO线程冻结为Arc，主帧共享来源快照。
serde_json = { workspace = true }
sha2 = { workspace = true } # 公共作者事务使用流式内容摘要，不复制完整JSON字节。

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] } # 下沉现有场景原子替换事务。
