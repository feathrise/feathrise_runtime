# SDK 独立仓库检查：编译默认和验收组合，并运行公共契约测试。
name: Windows SDK check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [default, validation]
    env:
      # 远程缓存只需复用编译产物。CI 不生成工作区增量数据和调试符号。
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      # 普通检查和独立检出使用同一 Cargo 锁。手动联调可显式选择补丁提交。
      FEATHRISE_PATCH_REPOSITORY: feathrise/feathrise_patches
      FEATHRISE_PATCH_REV: ${{ github.event_name == 'workflow_dispatch' && vars.FEATHRISE_PATCH_REV || '' }}
    steps:
      - name: Validate the pinned public patch source
        if: env.FEATHRISE_PATCH_REV != ''
        shell: pwsh
        run: |
          if ($env:FEATHRISE_PATCH_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or $env:FEATHRISE_PATCH_REV -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'SDK 工作流的补丁仓配置无效，必须使用 owner/repository 和完整 40 位提交。'
          }
      # actions/checkout v4.2.2；固定官方 tag 对应提交，避免可变 tag 漂移。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: feathrise_runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.FEATHRISE_PATCH_REV != ''
        with:
          repository: ${{ env.FEATHRISE_PATCH_REPOSITORY }}
          ref: ${{ env.FEATHRISE_PATCH_REV }}
          path: feathrise_patches
          persist-credentials: false
      - name: Identify the Cargo cache and existing Rust toolchain
        id: cargo-cache
        working-directory: feathrise_runtime
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Runner 没有可用的 Rust 工具链。' }
          $rustcVersion = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'rustc 无法启动。' }
          $rustcVersion
          $commit = [regex]::Match(($rustcVersion -join "`n"), '(?m)^commit-hash: ([0-9a-f]{40})$')
          if (!$commit.Success) { throw '无法读取现有 Rust 工具链的缓存身份。' }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $source = if ($env:FEATHRISE_PATCH_REV) { "patch-$($env:FEATHRISE_PATCH_REV.ToLowerInvariant())" } else { 'public' }
          "cargo-home=$cargoHome" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build-identity=$env:ImageOS-$($commit.Groups[1].Value)-$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # actions/cache v4.3.0；两个功能组合共用下载缓存，只保存归档、索引和 Git 对象库。
      - name: Restore Cargo dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ steps.cargo-cache.outputs.cargo-home }}/registry/cache
            ${{ steps.cargo-cache.outputs.cargo-home }}/registry/index
            ${{ steps.cargo-cache.outputs.cargo-home }}/git/db
          key: sdk-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('feathrise_runtime/Cargo.lock', 'feathrise_runtime/examples/native_plugin/Cargo.toml') }}
          restore-keys: sdk-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      # 编译产物按工具链、补丁来源和功能组合复用，依赖或编译参数变化时生成独立快照。
      - name: Restore SDK build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: feathrise_runtime/target
          key: >-
            sdk-check-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ steps.cargo-cache.outputs.build-identity }}-${{ hashFiles(
            'feathrise_runtime/Cargo.lock', 'feathrise_runtime/Cargo.toml',
            'feathrise_runtime/.cargo/config.toml', 'feathrise_runtime/crates/*/Cargo.toml',
            'feathrise_runtime/tests/workspace/Cargo.toml', 'feathrise_runtime/examples/native_plugin/Cargo.toml',
            'feathrise_runtime/.github/workflows/windows-check.yml') }}
      - name: Check SDK with existing Windows Rust and MSVC
        working-directory: feathrise_runtime
        shell: pwsh
        env:
          CHECK_VARIANT: ${{ matrix.variant }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'Runner 缺少 Visual Studio Installer/vswhere。' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Runner 缺少 MSVC x64/x86 工具。' }
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $sysroot = rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { throw '无法定位现有 Rust 工具链。' }
          $linkerDirectory = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin'
          if (!(Test-Path -LiteralPath (Join-Path $linkerDirectory 'rust-lld.exe'))) { throw '当前工具链缺少 rust-lld.exe。' }
          $env:PATH = "$linkerDirectory;$env:PATH"
          $sourceArguments = @()
          if ($env:FEATHRISE_PATCH_REV) {
            $patchRoot = (Resolve-Path -LiteralPath '../feathrise_patches').Path
            $patchRevision = git -C $patchRoot rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $patchRevision -ne $env:FEATHRISE_PATCH_REV) { throw '补丁仓检出身份与指定修订不一致。' }
            # 用单独的锁验收本地源码，保留公开检出的锁。
            New-Item -ItemType Directory -Path '.local/sdk' -Force | Out-Null
            Copy-Item -LiteralPath 'Cargo.lock' -Destination '.local/sdk/Cargo.lock'
            $sourceArguments = @('--config', (Join-Path $patchRoot '.cargo/config.toml'), '--config', "resolver.lockfile-path='.local/sdk/Cargo.lock'")
            cargo @sourceArguments fetch
            if ($LASTEXITCODE -ne 0) { throw '无法为指定的补丁准备联调锁。' }
          }
          $cargoArguments = $sourceArguments + @('check', '--locked', '-p', 'feathrise_runtime', '-p', 'feathrise_scene_core', '-p', 'feathrise_scene_content', '-p', 'feathrise_scene', '-p', 'feathrise_environment', '-p', 'feathrise_fps_display', '-p', 'feathrise_plugin_api', '-p', 'feathrise_sdk_workspace_tests', '--tests', '--examples')
          if ($env:CHECK_VARIANT -eq 'validation') { $cargoArguments += @('--features', 'feathrise_runtime/validation') }
          elseif ($env:CHECK_VARIANT -ne 'default') { throw '未知检查组合。' }
          # 这里检查 Rust 目标并运行静态链接的契约测试，省掉 Bevy 第三方依赖的高优化编译。
          $ciProfile = @('--config', 'profile.dev.package."*".opt-level=0')
          Write-Output '::group::Check SDK targets'
          cargo @ciProfile @cargoArguments
          if ($LASTEXITCODE -ne 0) { throw "Cargo 检查失败，退出码 $LASTEXITCODE。" }
          Write-Output '::endgroup::'
          # 这两条命令的目标不启用 SDK validation 特性，一次运行即可覆盖两组检查共用的契约。
          if ($env:CHECK_VARIANT -eq 'default') {
            Write-Output '::group::Run shared SDK contract tests'
            cargo @ciProfile @sourceArguments test --locked -p feathrise_plugin_api -p feathrise_editor_protocol -p feathrise_scene_content -p feathrise_scene_core --all-features --lib
            if ($LASTEXITCODE -ne 0) { throw '插件接口、预览协议或场景契约测试失败。' }
            Write-Output '::endgroup::'
            Write-Output '::group::Build the standalone native plugin example'
            cargo build --manifest-path examples/native_plugin/Cargo.toml --target-dir target --lib
            if ($LASTEXITCODE -ne 0) { throw '无编辑器源码的中性插件编译失败。' }
            Write-Output '::endgroup::'
          }
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'SDK 公开锁被改写，请核对联调锁配置。' }
