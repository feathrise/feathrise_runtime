[package]
name = "feathrise_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feathrise/feathrise_runtime"
description = "Shared Bevy runtime and project entry for Feathrise"

# 工程启动与公共装配直接归 SDK 的 project/app 模块，具体能力仍由子库提供。
[dependencies]
feathrise_scene_core = { version = "0.1.0", path = "crates/feathrise_scene_core" } # 统一场景视图、状态、活动门和驻留契约。
feathrise_vegetation = { version = "0.1.0", path = "crates/feathrise_vegetation", optional = true, features = ["blade", "diagnostics"] }
bevy = { version = "=0.19.1", features = ["file_watcher", "bevy_ui_widgets", "jpeg", "pbr_specular_textures"] }
avian3d = { version = "0.7.0", features = ["debug-plugin"] }
bevy_framepace = "=0.22.0"
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["3d"] }
async-channel = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0" } # 嵌入握手独立核对当前真实EXE，不复述宿主提供的构建身份。
subsecond = { version = "=0.7.9", optional = true } # 与已验证dx固定版本一致；旧补丁库保留到进程退出。
feathrise_editor_protocol = { version = "0.1.0", path = "crates/feathrise_editor_protocol" }
raw-window-handle = "=0.6.2"
wgpu-hal = { version = "=29.0.4", features = ["vulkan"] }
feathrise_scene = { version = "0.1.0", path = "crates/feathrise_scene", features = ["author_view"] }
feathrise_map_content = { version = "0.1.0", path = "crates/feathrise_map_content" }
feathrise_portal = { version = "0.1.0", path = "crates/feathrise_portal" }
feathrise_settings = { version = "0.1.0", path = "crates/feathrise_settings" }
feathrise_frame_generation = { version = "0.1.0", path = "crates/feathrise_frame_generation", optional = true }
feathrise_fsr3_frame_generation = { version = "0.1.0", path = "crates/feathrise_fsr3_frame_generation", optional = true }

# 公共装配所需的独立能力；原生后端和字体仍显式按需编入。
feathrise_grounding = { workspace = true }
feathrise_billboard_text = { workspace = true } # 通用材质与消息供场景标注和传送门使用；应用自行安装具体文字界面。
feathrise_raytracing = { workspace = true, optional = true } # 根程序默认raytracing、显式RTX与测试面板共用唯一Solari生命周期。
feathrise_fsr3 = { workspace = true, optional = true } # FSR 3时间域超分候选运行时。
feathrise_atmosphere = { workspace = true } # 分别保留世界时间与天气插件入口。
feathrise_font = { version = "=0.1.1", optional = true } # 仅在启用默认字体时嵌入完整字节。

[target.'cfg(windows)'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] } # 复用Bevy现有窗口；First完成模式与尺寸交接，不另建事件循环或启用Unix后端。
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[dev-dependencies]
# 示例沿用现有开发动态链接，普通库依赖不强制该选项。
bevy = { workspace = true, features = ["dynamic_linking"] }
# 原工程入口测试通过装配库取得字体；归并后由测试直接消费同一 registry 原件。
feathrise_font = { version = "=0.1.1" }
feathrise_scene = { workspace = true, features = ["runtime_test_support"] }

[features]
default = ["raytracing", "default_font"]
default_font = ["dep:feathrise_font"]
validation = ["dep:feathrise_vegetation"] # 作者探测与截图只进入显式验收构建。
function_hotpatch = ["bevy/hotpatching", "dep:subsecond"]
dynamic_linking = ["bevy/dynamic_linking"] # 原公共装配的显式开发选项，原生插件保持可自行选择。
raytracing = ["dep:feathrise_raytracing"]
dlss = ["dlss_frame_generation"]
fsr = ["fsr3_upscaling", "fsr3_frame_generation"]
rtx_rendering = ["raytracing", "bevy/dlss", "bevy/raw_vulkan_init", "feathrise_settings/dlss", "feathrise_raytracing/rtx_rendering"]
dlss_frame_generation = ["rtx_rendering", "dep:feathrise_frame_generation", "feathrise_settings/dlss_frame_generation"]
fsr3_upscaling = ["dep:feathrise_fsr3", "feathrise_settings/fsr3_upscaling"]
fsr3_frame_generation = ["dep:feathrise_fsr3_frame_generation"]
physics_debug = [] # 保留既有兼容入口，工程自行装配具体调试能力。
initial_items = []
test_panel = ["dep:feathrise_raytracing"]

[workspace]
resolver = "3"
members = [".", "crates/*", "tests/workspace"]
default-members = ["."]

[workspace.dependencies]
feathrise_scene_core = { version = "0.1.0", path = "crates/feathrise_scene_core" } # 场景基础契约和活动门；不依赖内容或高层运行入口。
feathrise_plugin_api = { version = "=0.1.0", path = "crates/feathrise_plugin_api" } # 插件开发只消费协议，不依赖编辑器实现。
# 同仓联调使用 path；发布时按 version 获取子库，不将 path 缺失当作自动回退。

feathrise_author_tools = { version = "0.1.0", path = "crates/feathrise_author_tools" } # 无Bevy依赖的笔刷、手柄与选择框语义合同。
feathrise_editor_protocol = { version = "0.1.0", path = "crates/feathrise_editor_protocol" } # 无 Bevy 依赖的有界常驻视口进程合同。

bevy = { version = "=0.19.1", default-features = true, features = [
    # SDK库可被独立DLL/SO使用；开发动态链接只在实际应用的依赖处开启。
    "file_watcher",
    "bevy_ui_widgets",
    # 场景 GLB 可能嵌入 JPEG 贴图；Bevy 未启用该 feature 时会拒绝 image/jpeg。
    "jpeg",
    # 工程 GLB 使用 KHR_materials_specular；开启后 Bevy 才会应用 specularTexture。
    "pbr_specular_textures",
] }
bevy_app = { version = "=0.19.1", default-features = false } # GI覆盖与Deferred flags依赖精确0.19 ABI，升级时必须整体复审。
wgpu = "=29.0.4" # GPU草地诊断直接复用Bevy 0.19.1锁定的QuerySet、时间戳和管线统计类型。
wgpu-ffx = "=0.1.0" # FSR 3候选固定到已审计的WGPU 29移植，并由本地patch移除帧路径同步等待。
bytemuck = { version = "1.25.0", features = ["derive"] } # 分块Mesh植被把只读世界矩阵直接上传为实例顶点流。
bevy_solari = "=0.19.1" # Bevy官方第一方实验性实时直接光、间接光与反射实现；不启用独立路径追踪插件。

avian3d = { version = "0.7.0", features = ["debug-plugin"] }

bevy-tnua = "0.32.0"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
meshopt = "=0.6.2" # 分块体积网格在后台按固定误差简化；版本参与私有网格配方，升级须保留旧文件重建兼容。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] } # 地图编辑器回写PNG，并在后台读取常见PBR PNG/JPEG源图派生纹理数组。
half = "2.7.1" # 天空漫反射Cube保持RGBA16F，在小型有界CPU副本中独立缩放补光通道。
# 通用 GPU 粒子渲染能力，由消费工程决定具体效果。
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }

sha2 = "0.11.0"
# FSR 固定预编译原生包只需读取 Deflate ZIP。
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

feathrise_grounding = { version = "0.1.0", path = "crates/feathrise_grounding" } # 统一按 Avian 真实地形高度吸附所有地面实体
feathrise_scene = { version = "0.1.0", path = "crates/feathrise_scene" } # 工程提供地图与预设，公共层负责场景生命周期。
feathrise_environment = { version = "0.1.0", path = "crates/feathrise_environment" } # 统一聚合GPU叶片植被、树木及灌木岩石固定景观，消费者通过feature按需启用。
feathrise_vegetation = { version = "0.1.0", path = "crates/feathrise_vegetation" } # 内容无关的种植分布、空间竞争、足迹净空与可插拔实现后端。
feathrise_billboard_text = { version = "0.1.0", path = "crates/feathrise_billboard_text" } # 通用离屏烘焙文字 Billboard 插件（可独立开源）
feathrise_atmosphere = { version = "0.1.0", path = "crates/feathrise_atmosphere" } # 世界时间、天体光照、天气模拟与环境表现
feathrise_portal = { version = "0.1.0", path = "crates/feathrise_portal" } # 传送门系统（场景切换）
feathrise_settings = { version = "0.1.0", path = "crates/feathrise_settings" } # 公共渲染请求、质量类型与后端状态。
feathrise_raytracing = { version = "0.1.0", path = "crates/feathrise_raytracing" } # 正式Solari/RR生命周期；rtx_rendering与调试兼容特性按需引入。
feathrise_frame_generation = { version = "0.1.0", path = "crates/feathrise_frame_generation" } # Windows Vulkan Streamline/DLSS-G/Reflex隔离运行时。
feathrise_runtime_manifest = { version = "=0.1.0", path = "crates/feathrise_runtime_manifest" } # 固定同一交付身份版本，不引入厂商 SDK。
feathrise_frame_generation_ui = { version = "0.1.0", path = "crates/feathrise_frame_generation_ui" } # SDK无关世界UI分离与透明捕获。
feathrise_fsr3_frame_generation = { version = "0.1.0", path = "crates/feathrise_fsr3_frame_generation" } # Windows Vulkan FidelityFX FSR 3.1固定2×帧生成运行时。
feathrise_fsr3 = { version = "0.1.0", path = "crates/feathrise_fsr3" } # Vulkan FSR 3时间域超分隔离RenderApp运行时。
feathrise_map_content = { version = "0.1.0", path = "crates/feathrise_map_content" } # 数据驱动地图清单、私有地图文件与传送图公共资产契约。
feathrise_map_terrain = { version = "0.1.0", path = "crates/feathrise_map_terrain" } # 动态地图GLB拓扑、内存高度场与白模编码共享纯算法。

# 经常修改的 SDK 工作区源码保持低优化；外部依赖高优化，也避免 Windows 未优化 Bevy 动态库超出 PE 导出表上限。
[profile.dev]
opt-level = 0
debug = "line-tables-only"
strip = false

# Cargo 的通配符不覆盖工作区成员，SDK 新增公共 crate 无需逐包维护。
[profile.dev.package."*"]
opt-level = 3

# Parley 兼容薄层从补丁仓接入，保留既有优化配置。
[profile.dev.package."parley:0.9.0"]
opt-level = 3

# 保留现有渲染开发命令和缓存名称，优化规则统一继承 dev。
[profile.render-dev]
inherits = "dev"
