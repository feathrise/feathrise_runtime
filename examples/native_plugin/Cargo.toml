# 中性原生插件：仅依赖公共接口，不需要Bevy或编辑器源码。
[package]
name = "feathrise_example_author_plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
[workspace]
resolver = "3"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
feathrise_plugin_api = { version = "=0.1.0", path = "../../crates/feathrise_plugin_api" }
[build-dependencies]
feathrise_plugin_api = { version = "=0.1.0", path = "../../crates/feathrise_plugin_api" }
